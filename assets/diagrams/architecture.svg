<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Openwire architecture</title>
  <desc id="desc">At startup, an OpenAPI specification is parsed into validated MCP tools. During a tool call, Openwire validates arguments, calls the REST API, and returns the compacted response to the MCP client.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#60766c" stroke-width="1.5"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="20" fill="#f8faf9" stroke="#dce7e1"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="36" y="35" font-size="11" font-weight="700" letter-spacing="2" fill="#52655c">STARTUP</text>
    <rect x="36" y="53" width="230" height="64" rx="12" fill="#fff" stroke="#d0ded6"/>
    <text x="56" y="79" font-size="16" font-weight="600" fill="#182d22">OpenAPI specification</text>
    <text x="56" y="101" font-size="12" fill="#52655c">File or URL · JSON / YAML</text>
    <path d="M268 85H321" stroke="#60766c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="333" y="53" width="267" height="64" rx="12" fill="#eaf6f0" stroke="#82bfa5"/>
    <text x="353" y="79" font-size="16" font-weight="600" fill="#182d22">Parse and build schemas</text>
    <text x="353" y="101" font-size="12" fill="#52655c">Resolve local references · map operations</text>
    <path d="M602 85H656" stroke="#60766c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="668" y="53" width="256" height="64" rx="12" fill="#fff" stroke="#d0ded6"/>
    <text x="688" y="79" font-size="16" font-weight="600" fill="#182d22">Register MCP tools</text>
    <text x="688" y="101" font-size="12" fill="#52655c">One per operation + health</text>
    <path d="M36 143H924" stroke="#dce7e1"/>
    <text x="36" y="175" font-size="11" font-weight="700" letter-spacing="2" fill="#52655c">TOOL CALL</text>
    <rect x="36" y="195" width="190" height="74" rx="12" fill="#fff" stroke="#d0ded6"/>
    <text x="56" y="225" font-size="16" font-weight="600" fill="#182d22">MCP client</text>
    <text x="56" y="248" font-size="12" fill="#52655c">Call a tool over stdio</text>
    <path d="M228 231H283" stroke="#60766c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="295" y="195" width="320" height="74" rx="12" fill="#111916"/>
    <text x="315" y="225" font-size="16" font-weight="600" fill="#f1efe8">Openwire</text>
    <text x="315" y="248" font-size="12" fill="#b6d4c5">Validate arguments → build HTTP request</text>
    <path d="M617 231H720" stroke="#60766c" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="646" y="216" font-size="11" fill="#52655c">HTTP(S)</text>
    <rect x="732" y="195" width="192" height="74" rx="12" fill="#fff" stroke="#d0ded6"/>
    <text x="752" y="225" font-size="16" font-weight="600" fill="#182d22">Your REST API</text>
    <text x="752" y="248" font-size="12" fill="#52655c">Execute the operation</text>
    <path d="M828 271V318H133V281" stroke="#1d9e75" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <rect x="273" y="302" width="420" height="28" rx="14" fill="#eaf6f0"/>
    <text x="483" y="321" text-anchor="middle" font-size="12" font-weight="500" fill="#176c50">HTTP status + compacted body · optional response limits</text>
  </g>
</svg>
